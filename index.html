    <title>Ride Radar</title>
    <style>
      #rr-prepaint {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #040406;
      }
      .rr-pp-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(hsl(240 14% 6%) 1px, transparent 1px),
          linear-gradient(90deg, hsl(240 14% 6%) 1px, transparent 1px);
        background-size: 48px 48px;
        opacity: 0.12;
        pointer-events: none;
      }
      .rr-pp-word {
        font: 800 16px/1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: hsl(107 100% 54%);
        text-shadow: 0 0 8px hsl(107 100% 54% / 0.5);
      }
    </style>

    <div id="root"></div>
    <div id="rr-prepaint" aria-hidden="true"><div class="rr-pp-grid"></div><span class="rr-pp-word">Ride Radar</span></div>
