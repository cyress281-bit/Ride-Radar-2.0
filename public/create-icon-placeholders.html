<!DOCTYPE html>
<html>
<head>
  <title>Generate PWA Icons</title>
</head>
<body>
  <h1>PWA Icon Generator</h1>
  <p>This will generate icon-192.png and icon-512.png from the SVG</p>
  <canvas id="canvas192" width="192" height="192" style="border: 1px solid #ccc; margin: 10px;"></canvas>
  <canvas id="canvas512" width="512" height="512" style="border: 1px solid #ccc; margin: 10px;"></canvas>
  <div>
    <button onclick="download('canvas192', 'icon-192.png')">Download 192x192</button>
    <button onclick="download('canvas512', 'icon-512.png')">Download 512x512</button>
  </div>

  <script>
    function drawIcon(canvas) {
      const ctx = canvas.getContext('2d');
      const size = canvas.width;
      const scale = size / 512;

      // Dark background with rounded corners (approximated)
      ctx.fillStyle = '#080808';
      ctx.fillRect(0, 0, size, size);

      // Neon green circles
      ctx.globalAlpha = 0.1;
      ctx.fillStyle = '#beff00';
      ctx.beginPath();
      ctx.arc(size/2, size/2, 180 * scale, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = 0.3;
      ctx.strokeStyle = '#beff00';
      ctx.lineWidth = 2 * scale;
      ctx.beginPath();
      ctx.arc(size/2, size/2, 140 * scale, 0, Math.PI * 2);
      ctx.stroke();

      ctx.globalAlpha = 0.4;
      ctx.beginPath();
      ctx.arc(size/2, size/2, 100 * scale, 0, Math.PI * 2);
      ctx.stroke();

      // RR Letters
      ctx.globalAlpha = 1;
      ctx.strokeStyle = '#beff00';
      ctx.lineWidth = 16 * scale;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // First R
      ctx.beginPath();
      ctx.moveTo(180 * scale, 200 * scale);
      ctx.lineTo(180 * scale, 312 * scale);
      ctx.moveTo(180 * scale, 200 * scale);
      ctx.lineTo(220 * scale, 200 * scale);
      ctx.quadraticCurveTo(240 * scale, 200 * scale, 240 * scale, 220 * scale);
      ctx.quadraticCurveTo(240 * scale, 240 * scale, 220 * scale, 240 * scale);
      ctx.lineTo(180 * scale, 240 * scale);
      ctx.moveTo(220 * scale, 240 * scale);
      ctx.lineTo(240 * scale, 270 * scale);
      ctx.stroke();

      // Second R
      ctx.beginPath();
      ctx.moveTo(280 * scale, 200 * scale);
      ctx.lineTo(280 * scale, 312 * scale);
      ctx.moveTo(280 * scale, 200 * scale);
      ctx.lineTo(320 * scale, 200 * scale);
      ctx.quadraticCurveTo(340 * scale, 200 * scale, 340 * scale, 220 * scale);
      ctx.quadraticCurveTo(340 * scale, 240 * scale, 320 * scale, 240 * scale);
      ctx.lineTo(280 * scale, 240 * scale);
      ctx.moveTo(320 * scale, 240 * scale);
      ctx.lineTo(340 * scale, 270 * scale);
      ctx.stroke();

      // Center dot
      ctx.fillStyle = '#beff00';
      ctx.beginPath();
      ctx.arc(256 * scale, 256 * scale, 8 * scale, 0, Math.PI * 2);
      ctx.fill();

      // Radar sweep
      ctx.globalAlpha = 0.6;
      ctx.lineWidth = 4 * scale;
      ctx.beginPath();
      ctx.moveTo(256 * scale, 256 * scale);
      ctx.lineTo(336 * scale, 256 * scale);
      ctx.stroke();
    }

    drawIcon(document.getElementById('canvas192'));
    drawIcon(document.getElementById('canvas512'));

    function download(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      const url = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
    }
  </script>
</body>
</html>
